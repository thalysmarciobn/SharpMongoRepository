name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # All three runtimes, because the library and the test project target all three.
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        # ContinuousIntegrationBuild turns warnings into errors and makes the build deterministic.
        run: dotnet build --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Unit tests
        # Every target framework. Integration tests are excluded here and run in their own job.
        run: >
          dotnet test --configuration Release --no-build
          --filter "Category!=Integration"
          --logger "trx;LogFileName=unit.trx"
          --collect:"XPlat Code Coverage"

      - name: Validate the package
        run: dotnet pack Core/SharpMongoRepository.csproj --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/TestResults/**'

  integration:
    name: Integration test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Integration tests
        # Testcontainers starts a single-node MongoDB replica set against the runner's Docker daemon.
        # One target framework is enough: these assert server behaviour, not per-framework code paths.
        run: >
          dotnet test Tests/Tests.csproj --configuration Release --framework net10.0
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/TestResults/**'

  security:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Fail on a vulnerable package
        # Including transitive ones: both advisories this repository shipped with came in that way.
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee scan.log
          if grep -q -E '(Critical|High|Moderate|Low)' scan.log; then
            echo "::error::Vulnerable packages found. See the log above."
            exit 1
          fi

      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list package --deprecated --include-transitive
