name: Publish

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: Core/SharpMongoRepository.csproj

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          # SourceLink needs the full history to resolve the commit it stamps into the symbols.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip a leading v from the tag if there is one, so both v0.1.0 and 0.1.0 work. The old
            # workflow gated packing on a v prefix but left the push ungated, so a tag without one
            # skipped the pack and then failed on an empty glob.
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a semantic version."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Check the version matches the project file
        run: |
          DECLARED=$(grep -oP '(?<=<Version>)[^<]+' ${{ env.PROJECT }})
          if [ "$DECLARED" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::The tag says ${{ steps.version.outputs.version }} but ${{ env.PROJECT }} declares $DECLARED. Update the project file and the changelog before tagging."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Unit tests
        run: dotnet test --configuration Release --filter "Category!=Integration"

      - name: Integration tests
        run: dotnet test Tests/Tests.csproj --configuration Release --framework net10.0 --filter "Category=Integration"

      - name: Pack
        run: >
          dotnet pack ${{ env.PROJECT }} --configuration Release --no-build
          -p:ContinuousIntegrationBuild=true
          -p:Version=${{ steps.version.outputs.version }}
          --output ./artifacts

      - name: Upload the package as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: SharpMongoRepository-${{ steps.version.outputs.version }}
          path: ./artifacts/*

      - name: Publish to NuGet.org
        # The README tells people to `dotnet add package SharpMongoRepository`, so NuGet.org is the
        # primary feed. The old workflow only pushed to GitHub Packages, which meant every NuGet.org
        # release was being produced by hand outside CI.
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The NUGET_API_KEY secret is not set."
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Publish to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --skip-duplicate
